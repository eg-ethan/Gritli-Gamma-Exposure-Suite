# Local Docker setup for the GEX Suite Go core.
#
#   docker compose up -d --build   → GUI at http://localhost:8787
#   docker compose logs -f gex-core
#   docker compose down            (add -v to wipe the saved state)
#
# Status (2026-09-09): wired for the LIVE C# edge. The core listens for the
# edge protocol on 7878 (0.0.0.0 + port mapping, same pattern as the GUI
# port) and journals every wire line to /data/live.jsonl for gexctl replay.
# The synthetic feed is OFF. Vendor OI (CBOE) is on by default — this TWS
# account streams no option OI. GUI Disconnect pauses the EDGE (core pushes
# `pause`; the edge tears its TWS session down — no snapshot/line spend
# while the GUI is frozen); a hidden GUI tab auto-disconnects after 10s.
#
# Start the Windows-side edge in NO-SNAPSHOT mode (rotation-only — the OI
# rotation's streaming lines carry Greeks/IV; live spot via underlying L1
# lines; GEX positions from CBOE vendor OI):
#
#   edge/src/GexEdge/bin/Debug/net8.0/win-x64/gex-edge.exe \
#       --core 127.0.0.1:7878 --tws 127.0.0.1:7496 --client-id 11 \
#       --tickers SPX,NDX,VIX,TSLA,NVDA,SOXX,GOOG,JPM --no-sweep
#
# (drop --no-sweep to re-enable the snapshot-sweep engine; see edge/README.md.)

services:
  gex-core:
    build:
      context: ./core
    image: gex-core:dev
    container_name: gex-core
    # host side bound to loopback: neither port has auth, so nothing else on
    # the network may reach the GUI API or inject edge-protocol data
    ports:
      - "127.0.0.1:8787:8787"
      - "127.0.0.1:7878:7878"
    volumes:
      - gex-data:/data
    # --addr/--edge-addr 0.0.0.0 are required to be reachable through the
    # port mappings (the flags' localhost defaults are container-internal
    # only); --connect starts with streams connected so the edge's data
    # applies as soon as it arrives (no manual GUI Connect needed). Vendor
    # OI (CBOE) is on by default — this TWS account streams no option OI
    command: ["serve", "--addr", "0.0.0.0:8787", "--edge-addr", "0.0.0.0:7878", "--db", "/data/gex.db", "--journal", "/data/live.jsonl", "--connect"]
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:8787/api/state"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 5s

volumes:
  gex-data:
